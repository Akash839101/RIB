name: Email queue worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-queue-worker
  cancel-in-progress: false

jobs:
  process-email-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: RichInBox/backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL || 'http://localhost:4000' }}
      WEB_APP_URL: ${{ vars.WEB_APP_URL || 'http://localhost:5173' }}
      WORKER_RUN_DURATION_MS: '120000'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: RichInBox/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend and worker
        run: npm run build

      - name: Process due email jobs
        run: npm run start:worker:window
        env:
          NODE_ENV: production
